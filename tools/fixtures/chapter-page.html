<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟超星章节页（视频 + 章节测验标签）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; color: #1b2333; }

  .layout { display: flex; gap: 24px; align-items: flex-start; }
  .toc { width: 210px; flex-shrink: 0; }
  .toc h3 { font-size: 12px; color: #8b95a8; margin: 0 0 8px; letter-spacing: .05em; }
  .toc-item { padding: 6px 9px; border-radius: 6px; font-size: 13px; color: #5a6579; margin-bottom: 2px; }
  .toc-item a { color: inherit; text-decoration: none; }
  .toc-item.active { background: #e8f0ff; color: #2f6fed; font-weight: 600; }

  main { flex: 1; min-width: 0; }
  h1 { font-size: 18px; margin: 0 0 14px; }

  .tabbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .tab {
    padding: 5px 15px; border-radius: 999px;
    border: 1px solid #cbd3e1; font-size: 13px; color: #5a6579;
    text-decoration: none; cursor: pointer;
  }
  .tab.active { background: #2f6fed; border-color: #2f6fed; color: #fff; }

  .banner { color: #c00; font-size: 20px; font-weight: 700; text-align: center; margin: 6px 0 12px; }
  .player { width: 100%; height: 240px; background: #111; border-radius: 8px; display: grid; place-items: center; color: #888; }

  .pager { margin-top: 20px; }
  #next-section {
    display: inline-block; padding: 7px 20px; border-radius: 6px;
    border: 1px solid #cbd3e1; color: #5a6579; text-decoration: none; font-size: 13px;
  }
  #next-section.last { color: #bbb; border-color: #ececec; cursor: not-allowed; }

  .TiMu { border: 1px solid #e2e7f0; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .Zy_TItle .fl.letter { font-size: 12px; color: #2f6fed; display: block; margin-bottom: 4px; }
  .Zy_ulTop { list-style: none; margin: 0; padding: 0; }
  .check_answer { font-style: normal; font-weight: 600; margin-right: 6px; }
  .Py_answer { margin-top: 8px; font-size: 13px; color: #0e7a46; }
</style>
</head>
<body>

<div class="layout">
  <aside class="toc">
    <h3>目录</h3>
    <div class="toc-item">1.1 新民主主义革命的胜利</div>
    <!-- ↓ 三个诱饵：文案和「章节测验」标签一模一样，但它们不在标签栏里 -->
    <div class="toc-item"><a href="javascript:;">章节测验</a></div>
    <div class="toc-item active">1.2 国民经济的恢复</div>
    <div class="toc-item"><a href="javascript:;">章节测验</a></div>
    <div class="toc-item"><a href="javascript:;">课后作业</a></div>
  </aside>

  <main>
    <h1 id="title">1.3 国民经济的恢复</h1>

    <div class="tabbar" id="tabbar">
      <a class="tab active" id="tab-video" href="javascript:;">1 视频</a>
      <a class="tab" id="tab-quiz" href="javascript:;">2 章节测验</a>
    </div>

    <!-- 「课程视频」也是诱饵：文案里含「视频」但不是标签 -->
    <div class="banner">课程视频</div>

    <div id="content"></div>

    <div class="pager">
      <a id="next-section" href="javascript:;">下一节</a>
    </div>
  </main>
</div>

<script src="core.js"></script>
<script src="extractor.js"></script>
<script>
(function () {
  'use strict';

  window.__log = [];
  window.__MODE = window.__MODE || 'chapter';

  var content = document.getElementById('content');
  var tabVideo = document.getElementById('tab-video');
  var tabQuiz = document.getElementById('tab-quiz');
  var tabbar = document.getElementById('tabbar');
  var title = document.getElementById('title');
  var nextBtn = document.getElementById('next-section');

  /*
   * chain 模式用：本章有三节
   *   s1/s2 有章节测验，s3 没有测验（连标签栏都没有，用来测「跳过空小节」）
   * 最后一节的按钮文案变成「下一章」，用来测「不跨章」
   */
  var SECTIONS = [
    { id: 's1', title: '1.3 国民经济的恢复', quiz: 3, tabs: true },
    { id: 's2', title: '1.4 社会主义改造', quiz: 2, tabs: true },
    { id: 's3', title: '1.5 第一个五年计划', quiz: 0, tabs: false }
  ];
  var curSection = 0;

  var seq = 0;

  function questionHtml(count, tag) {
    var out = '';
    for (var i = 0; i < count; i++) {
      var n = ++seq;
      out += '<div class="TiMu">' +
        '<div class="Zy_TItle clearfix">' +
        '  <div class="fl letter">(单选题)</div>' +
        '  <div class="clearfix">' + n + '、【' + tag + '】第 ' + n + ' 题</div>' +
        '</div>' +
        '<ul class="Zy_ulTop">' +
        '  <li><label><i class="fl check_answer">A</i><a class="fl"><span>选项甲</span></a></label></li>' +
        '</ul>' +
        '<div class="Py_answer clearfix"><div>正确答案：A</div></div>' +
        '</div>';
    }
    return out;
  }

  function showVideo() { content.innerHTML = '<div class="player">点击播放</div>'; }
  function showQuiz() {
    var s = SECTIONS[curSection];
    content.innerHTML = s ? questionHtml(s.quiz, s.id) : questionHtml(3, 'default');
  }

  function activate(tab) {
    tabVideo.classList.toggle('active', tab === 'video');
    tabQuiz.classList.toggle('active', tab === 'quiz');
  }

  tabVideo.addEventListener('click', function () {
    window.__log.push('click:video');
    activate('video');
    showVideo();
  });

  tabQuiz.addEventListener('click', function () {
    window.__log.push('click:quiz');
    activate('quiz');
    showQuiz();
  });

  function renderSection(i) {
    curSection = i;
    var s = SECTIONS[i];

    title.textContent = s.title;
    tabbar.style.display = s.tabs ? 'flex' : 'none';

    activate('video');
    showVideo();

    // 最后一节把按钮换成「下一章」—— 扩展应当就此停下，不要跨章
    var isLast = i >= SECTIONS.length - 1;
    nextBtn.textContent = isLast ? '下一章' : '下一节';
    nextBtn.classList.toggle('last', isLast);

    window.__log.push('render:' + s.id);
  }

  nextBtn.addEventListener('click', function () {
    window.__log.push('click:next');
    if (curSection < SECTIONS.length - 1) renderSection(curSection + 1);
    else window.__log.push('next:blocked');
  });

  if (window.__MODE === 'notabs') {
    // 没有标签栏：只剩目录树里的诱饵。这时候绝不能点任何东西
    tabbar.style.display = 'none';
    nextBtn.style.display = 'none';
    showVideo();

  } else if (window.__MODE === 'already') {
    // 章节测验已经打开着（有题目），不该再点
    nextBtn.style.display = 'none';
    activate('quiz');
    showQuiz();

  } else if (window.__MODE === 'chain') {
    // 从第一节开始，让扩展自己一节一节往下走
    renderSection(0);

  } else {
    nextBtn.style.display = 'none';   // 单页场景不需要翻节按钮
    activate('video');
    showVideo();
  }
})();
</script>
</body>
</html>
